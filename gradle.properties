# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
# The final version is <mod_version>+<minecraft_version>, e.g. 0.1.0+1.21.1
mod_version=0.1.0
group=empire.empirewarrior
java_version=21

# Common
minecraft_version=1.21.1
mod_name=EWLIB
mod_author=EmpireWarrior81
mod_id=ewlib
license=MIT
credits=Config system modelled after owo-lib by glisco & the Wisp Forest team (MIT)
description=Shared library for EmpireWarrior81's mods: annotation-driven configs with an auto-generated config screen.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# Parchment parameter names - https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.116.12+1.21.1
fabric_loader_version=0.19.2
# Mod Menu (optional integration) - https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu
modmenu_version=11.0.4

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.1.248
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
